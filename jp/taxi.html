<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タクシー運転手に見せる画面 | ソウルBD歯科</title>
  <meta name="description" content="タクシーの運転手さんにこの画面をそのままお見せください。ソウルBD歯科（天安・プルダン洞）の韓国語住所を大きく表示します。">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://bdbddc.com/jp/taxi">
  <link rel="icon" type="image/webp" href="/images/logo.webp">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"游ゴシック体",YuGothic,"游ゴシック Medium","Yu Gothic Medium","Yu Gothic",游ゴシック,"ヒラギノ角ゴ Pro W3","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:#fff;color:#1a1917;min-height:100vh;display:flex;flex-direction:column}
    .taxi-note{background:#6B4226;color:#fff;text-align:center;padding:14px 16px;font-size:.95rem;letter-spacing:.03em}
    .taxi-note strong{font-size:1.05rem}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;gap:22px}
    .driver-msg{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:700;line-height:1.5;color:#1a1917;word-break:keep-all}
    .address-card{background:#FBF7F1;border:3px solid #6B4226;border-radius:20px;padding:28px 24px;max-width:640px;width:100%}
    .address-kr{font-size:clamp(1.5rem,6vw,2.6rem);font-weight:800;line-height:1.5;color:#6B4226;word-break:keep-all}
    .clinic-kr{font-size:clamp(1.2rem,4.5vw,1.8rem);font-weight:700;margin-top:10px;color:#1a1917}
    .landmark-kr{font-size:clamp(1rem,3.5vw,1.3rem);color:#6b6862;margin-top:12px;line-height:1.6}
    .phone-row{font-size:clamp(1.1rem,4vw,1.5rem);font-weight:700}
    .phone-row a{color:#6B4226;text-decoration:none}
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:12px;font-size:1rem;font-weight:700;text-decoration:none;letter-spacing:.02em}
    .btn-map{background:#03C75A;color:#fff}
    .btn-kakao{background:#FEE500;color:#191919}
    .btn-back{background:#f0ece5;color:#6B4226}
    footer{text-align:center;padding:16px;font-size:.8rem;color:#9b968e}
  </style>
</head>
<body>
  <h1 class="taxi-note" style="font-size:inherit;font-weight:inherit;margin:0;"><strong>🚕 この画面を、そのままタクシーの運転手さんにお見せください</strong></h1>
  <main>
    <p class="driver-msg">기사님, 아래 주소로 부탁드립니다 🙏<br><span style="font-size:.75em;font-weight:500;color:#6b6862">（運転手さん、下の住所までお願いします）</span></p>
    <section class="address-card" id="taxi-address">
      <p class="address-kr">충청남도 천안시 서북구<br>불당34길 14</p>
      <p class="clinic-kr">서울비디치과 (1~5층 건물)</p>
      <p class="landmark-kr">불당동 CGV 맞은편입니다<br><span style="font-size:.85em">（プルダン洞のCGV映画館の向かいです）</span></p>
    </section>
    <p class="phone-row">📞 <a href="tel:0414152892">041-415-2892</a></p>
    <div class="btn-row">
      <a class="btn btn-map" href="https://map.naver.com/p/search/%EC%84%9C%EC%9A%B8%EB%B9%84%EB%94%94%EC%B9%98%EA%B3%BC" target="_blank" rel="noopener">🗺️ NAVERマップで開く</a>
      <a class="btn btn-kakao" href="https://map.kakao.com/?q=%EC%84%9C%EC%9A%B8%EB%B9%84%EB%94%94%EC%B9%98%EA%B3%BC" target="_blank" rel="noopener">🗺️ カカオマップで開く</a>
      <a class="btn btn-back" href="/jp/directions">← アクセス案内に戻る</a>
    </div>
  </main>
  <footer>ソウルBD歯科 · 忠清南道 天安市 西北区 プルダン34ギル 14</footer>
</body>
</html>
