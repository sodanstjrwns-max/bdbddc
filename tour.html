const R = (X0, X1, Y0, Y1, type, name, opt = {}) => ({ x0: px(X0), x1: px(X1), z0: pz(Y0), z1: pz(Y1), type, name, ...opt });
const H = (num, title, X, Y, desc, link, linkLabel, video, stand) => ({ num, title, x: px(X), z: pz(Y), desc, link, linkLabel, video, stand: stand && { x: px(stand[0]), z: pz(stand[1]) } });

  R(10.05, 15.5, 17.5, 19.75, 'elev', '엘리베이터', { solid: true }),

function decorA(g) {

  const n = Number(b.dataset.floor); if (n === 0) goOverview(); else if (state.mode === 'walk') goWalk(n); else goFloor(n);
});

/* ---------------- input ---------------- */
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
const pointers = new Map(); let dragging = false, downAt = null, pinchDist = 0;
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; dragging = false; state.autoRotate = false; if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); } });
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinchDist) zoom((pinchDist - d) * 0.004); pinchDist = d; return; }
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) { dragging = true; canvas.classList.add('dragging'); }
  if (!dragging) return;
  if (state.mode === 'walk') { state.walk.yaw -= dx * 0.0042; state.walk.pitch = THREE.MathUtils.clamp(state.walk.pitch - dy * 0.0032, -0.9, 0.9); }
  else { state.orbit.theta -= dx * 0.0055; state.orbit.phi = THREE.MathUtils.clamp(state.orbit.phi - dy * 0.0045, 0.12, 1.42); }
});
function endPointer(e) {
  pointers.delete(e.pointerId); canvas.classList.remove('dragging');
  if (pointers.size === 0 && !dragging && downAt && performance.now() - downAt.t < 450) tap(e.clientX, e.clientY);
  if (pointers.size === 0) { downAt = null; dragging = false; pinchDist = 0; }
}
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom(e.deltaY * 0.0022); }, { passive: false });
function zoom(a) { if (state.mode === 'walk') { state.walk.pitch = THREE.MathUtils.clamp(state.walk.pitch - a * 0.08, -0.9, 0.9); return; } state.orbit.radius = THREE.MathUtils.clamp(state.orbit.radius * (1 + a), 5, 110); }

function tap(cx, cy) {
  const r = canvas.getBoundingClientRect(); ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera);
  if (state.mode === 'overview') {
    const hits = ray.intersectObjects(floorGroups.flatMap((f) => f.floorMeshes), false); if (hits.length) goFloor(hits[0].object.userData.floorN); return;
  }
  const f = floorGroups[state.floor - 1];
  const hs = ray.intersectObjects(f.hotspots, false); if (hs.length) { focusHotspot(hs[0].object.userData.hotspot); return; }
  if (state.mode === 'walk') {
    const fl = ray.intersectObjects(f.floorMeshes, false); if (fl.length) { const p = fl[0].point; state.walk.moveTo = new THREE.Vector3(p.x, 1.6, p.z); }
  } else {
    // a visible lower floor was tapped → switch to it
    const hits = ray.intersectObjects(floorGroups.filter((x) => x.group.visible && x.n !== state.floor).flatMap((x) => x.floorMeshes), false);
    if (hits.length) goFloor(hits[0].object.userData.floorN);
  }
}
window.addEventListener('keydown', (e) => { if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) { keys.add(e.code); if (state.mode === 'walk') e.preventDefault(); } if (e.code === 'Escape') hideCard(); });
window.addEventListener('keyup', (e) => keys.delete(e.code));

/* collision */
function blocked(f, x, z, rad = 0.32) { for (const w of f.walls) if (x > w.x0 - rad && x < w.x1 + rad && z > w.z0 - rad && z < w.z1 + rad) return true; return false; }
function tryMove(f, dx, dz) { const p = state.walk.pos; if (!blocked(f, p.x + dx, p.z)) p.x += dx; if (!blocked(f, p.x, p.z + dz)) p.z += dz; }

/* ---------------- resize / loop ---------------- */
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;   // hidden or not laid out yet: keep the last good size
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 62 : 50; camera.updateProjectionMatrix(); if (state.mode === 'overview') state.orbit.radius = overviewRadius(); else if (state.mode === 'floor' && !state.selected) state.orbit.radius = floorRadius(state.floor); }
new ResizeObserver(resize).observe(canvas); resize();

let last = performance.now(), firstFrame = true; const tmpV = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // floor spacing animation (exploded in the overview, real spacing inside)
  for (const f of floorGroups) { f.group.position.y += (f.targetY - f.group.position.y) * Math.min(1, dt * 6); }
  if (state.autoRotate && state.mode === 'overview') state.orbit.theta += dt * 0.08;
  // walking
  if (state.mode === 'walk') {
    const f = floorGroups[state.floor - 1]; const sp = 2.6 * dt; const fwd = new THREE.Vector2(-Math.sin(state.walk.yaw), -Math.cos(state.walk.yaw)); const right = new THREE.Vector2(-fwd.y, fwd.x);
    let mx = 0, mz = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) { mx += fwd.x; mz += fwd.y; } if (keys.has('KeyS') || keys.has('ArrowDown')) { mx -= fwd.x; mz -= fwd.y; }
    if (keys.has('KeyD') || keys.has('ArrowRight')) { mx += right.x; mz += right.y; } if (keys.has('KeyA') || keys.has('ArrowLeft')) { mx -= right.x; mz -= right.y; }
    if (mx || mz) { const l = Math.hypot(mx, mz); tryMove(f, mx / l * sp, mz / l * sp); state.walk.moveTo = null; }
    else if (state.walk.moveTo) { const t = state.walk.moveTo, p = state.walk.pos; const dx = t.x - p.x, dz = t.z - p.z, dist = Math.hypot(dx, dz); if (dist < 0.15) state.walk.moveTo = null; else { const step = Math.min(dist, 3.2 * dt); const before = p.clone(); tryMove(f, dx / dist * step, dz / dist * step); if (p.distanceTo(before) < step * 0.3) state.walk.moveTo = null; } }
  }
  // camera
  ambient.intensity += ((state.mode === 'walk' ? 0.7 : 0.35) - ambient.intensity) * Math.min(1, dt * 4);
  const want = desiredPose();
  if (state.transition) { const tr = state.transition; const t = Math.min(1, (now - tr.t0) / (tr.dur * 1000)); const k = ease(t); camera.position.lerpVectors(tr.fromPos, want.pos, k); camera.quaternion.slerpQuaternions(tr.fromQuat, want.quat, k); if (t >= 1) state.transition = null; }
  else { camera.position.copy(want.pos); camera.quaternion.copy(want.quat); }
  // hotspot bob + selection pulse; in walk mode, shrink pins and hide room labels that are right next to the camera
  const bob = reduceMotion ? 0 : Math.sin(now / 420) * 0.07;
  const walking = state.mode === 'walk', camWorld = camera.position;
  for (const f of floorGroups) {
    for (const s of f.hotspots) {
      if (!s.visible) continue; s.position.y = 2.0 + bob;
      const sel = state.selected && state.selected.num === s.userData.hotspot.num && state.selected.floor === f.n;
      let sc = sel ? 1.25 + (reduceMotion ? 0 : Math.sin(now / 260) * 0.06) : 0.95;
      if (walking) { s.getWorldPosition(tmpV); sc *= THREE.MathUtils.clamp(tmpV.distanceTo(camWorld) / 5, 0.25, 1); }
      s.scale.set(sc, sc, 1);
    }
    if (f.n === state.floor && state.mode !== 'overview') for (const l of f.roomLabels) { l.getWorldPosition(tmpV); const dist = tmpV.distanceTo(camWorld); l.material.opacity = walking ? THREE.MathUtils.clamp((dist - 3) / 3, 0, 1) : 1; }
  }
  // keep the sun centred on what we look at
  sun.target.position.set(0, 0, 0); sun.position.set(28, 42 + (state.mode === 'overview' ? 10 : floorGroups[state.floor - 1].group.position.y), 18);
  renderer.render(scene, camera);
  if (firstFrame) { firstFrame = false; overlay.classList.add('off'); }
}
setVisibility(); updateUI(); resize();
camera.position.copy(desiredPose().pos); camera.quaternion.copy(desiredPose().quat);
window.__tour = { state, floorGroups, tap, goFloor, goWalk, goOverview, focusHotspot };
requestAnimationFrame(frame);
</script>
<script>
// If the 3D module never renders (blocked CDN, old browser), say so instead of spinning forever.
setTimeout(function () { var o = document.getElementById('overlay'); if (o && !o.classList.contains('off')) document.getElementById('ovMsg').textContent = '3D 엔진을 불러오지 못했어요. 네트워크를 확인하고 새로고침해 주세요.'; }, 9000);
</script>
</body>
